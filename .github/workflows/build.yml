name: build

# Reusable pipeline: builds every FFmpegKit variant at a given version, validates the packed
# packages, runs the simulator smoke tests, and uploads the packages as an artifact.
# Callers (pr.yml, release.yml) decide the version and what to do with the result.

on:
  workflow_call:
    inputs:
      version:
        description: NuGet version to stamp on every package.
        required: true
        type: string
      native-version:
        description: >
          FFmpegKit native version to bind against. Defaults to FFmpegKitNativeVersion in
          Directory.Build.props; set it to build a package for an older line, e.g. 7.1.1.
        required: false
        default: ''
        type: string
      e2e-variant:
        description: Which variant the simulator smoke test installs and runs.
        required: false
        default: Video
        type: string
      e2e-target-frameworks:
        description: >
          Which of the package's target frameworks the simulator smoke test runs against, as a
          JSON array - one matrix job per entry. Defaults to the two extremes: net8, the oldest
          asset set and the one nothing else exercises, and net10, whose assets are produced by
          the merge step in BuildNugets.sh and so are the only ones that could be grafted in
          wrong. net9 sits between them and comes out of the same pack pass as net8, so testing
          it too would buy little for the runner minutes.
        required: false
        default: '["net8.0-ios18.0", "net10.0-ios26.0"]'
        type: string

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  pack:
    name: build and pack
    timeout-minutes: 60
    # iOS builds require a macOS runner with Xcode - there is no cross-platform path for the
    # native toolchain, unlike the Android bindings which build on ubuntu.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # 9.0.x packs net8+net9 (global.json pins it) and 10.0.x packs net10.
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install iOS workloads for every SDK band
        run: |
          # Each band supplies different reference packs: net8.0-ios18.0 and net9.0-ios18.0 come
          # from the .NET 9 band, net10.0-ios26.0 from the .NET 10 band. The SDK is chosen by the
          # global.json in the working directory, so each band is installed from a scratch
          # directory pinned to that SDK.
          for major in 9 10; do
            dir="${RUNNER_TEMP}/sdk${major}"
            mkdir -p "${dir}"
            sdk=$(dotnet --list-sdks | grep "^${major}\." | tail -1 | cut -d' ' -f1)
            echo "installing ios workload for SDK ${sdk}"
            ( cd "${dir}" \
              && dotnet new globaljson --sdk-version "${sdk}" --force \
              && dotnet workload install ios )
          done

      - name: Resolve native version
        id: native
        run: |
          version="${{ inputs.native-version }}"
          if [ -z "${version}" ]; then
            version=$(sed -n 's:.*<FFmpegKitNativeVersion>\(.*\)</FFmpegKitNativeVersion>.*:\1:p' Directory.Build.props | head -1)
          fi
          if [ -z "${version}" ]; then
            echo "::error::could not determine the FFmpegKit native version"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Binding FFmpegKit ${version}" >> "$GITHUB_STEP_SUMMARY"

      - name: Cache FFmpegKit xcframeworks
        id: xcframeworks
        uses: actions/cache@v4
        with:
          path: src/FFmpegKit.iOS/libs
          # The native version is part of the key: without it a build for an older line would
          # restore the previous version's frameworks and bind the wrong thing.
          key: ffmpegkit-xcframeworks-${{ steps.native.outputs.version }}-${{ hashFiles('build/FetchXcFrameworks.sh') }}

      - name: Fetch FFmpegKit xcframeworks
        if: steps.xcframeworks.outputs.cache-hit != 'true'
        run: ./build/FetchXcFrameworks.sh "${{ steps.native.outputs.version }}"

      - name: Pack all variants
        run: ./build/BuildNugets.sh "${{ inputs.version }}" "${{ steps.native.outputs.version }}"

      - name: Validate packages
        run: dotnet test tests/FFmpegKit.iOS.PackageTests --logger 'trx;LogFileName=package-tests.trx'

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-test-results
          path: '**/*.trx'
          if-no-files-found: ignore
          retention-days: 7

  build-samples:
    name: sample build (${{ matrix.tfm }})
    # Release iOS AOT is slow here: the trimmer and LLVM (MtouchUseLlvm defaults on) statically
    # link ~150 MB of FFmpeg per target framework - measured at 7m43s locally against 19s for the
    # old Debug check, and a runner is slower still, so an earlier attempt was killed at 48
    # minutes. The two legs run concurrently, so wall-clock is one leg, not two; the ceiling is
    # generous to stay clear of that historical kill.
    timeout-minutes: 90
    needs: pack
    runs-on: macos-15
    strategy:
      # fail-fast off: the net8 and net10 legs fail for opposite reasons - an old UI dependency
      # dropping the oldest band, or a new one not yet supporting the newest - so a red net10 next
      # to a green net8 already localises the cause.
      fail-fast: false
      matrix:
        # The net8 and net10 extremes of what the binding ships, each on its own SDK band. The
        # sample restores the packed package through a PackageReference exactly as a consumer
        # would and links under the Release AOT toolchain, where a binding that restores fine in
        # Debug can still fail to link. It regressed silently once - regenerating the binding
        # turned session.ReturnCode()/State() into properties and nothing built the sample to
        # notice.
        include:
          - band: net8
            tfm: net8.0-ios18.0
          - band: net10
            tfm: net10.0-ios26.0
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install the MAUI iOS workload for the ${{ matrix.band }} band
        run: |
          # The sample targets exactly one framework per band (SampleSdkBand), so a single band's
          # workload is enough and restore never walks a framework this band cannot build. Pinned
          # through a scratch global.json because .NET for iOS couples the target framework to the
          # SDK band that carries the matching workload.
          major="$(printf '%s' '${{ matrix.band }}' | sed 's/net//')"
          sdk="$(dotnet --list-sdks | grep "^${major}\." | tail -1 | cut -d' ' -f1)"
          dir="${RUNNER_TEMP}/workload-${{ matrix.band }}"
          mkdir -p "${dir}"
          ( cd "${dir}" \
            && dotnet new globaljson --sdk-version "${sdk}" --force \
            && dotnet workload install maui-ios )

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Build the ${{ matrix.tfm }} sample against the packed package
        run: |
          # Built on the band's own SDK: the repository global.json pins .NET 9, so a scratch
          # global.json in the invocation directory selects the band that owns this framework.
          # Release, so the AOT/trimmer path is exercised; pinned to the simulator RID because the
          # sample is built and never launched, so Release's device-signing concerns do not apply.
          major="$(printf '%s' '${{ matrix.band }}' | sed 's/net//')"
          sdk="$(dotnet --list-sdks | grep "^${major}\." | tail -1 | cut -d' ' -f1)"
          dir="${RUNNER_TEMP}/build-${{ matrix.band }}"
          mkdir -p "${dir}"
          printf '{ "sdk": { "version": "%s", "rollForward": "latestFeature" } }\n' "${sdk}" > "${dir}/global.json"
          ( cd "${dir}" && dotnet build "${GITHUB_WORKSPACE}/samples/FFmpegKit.iOS.Example/FFmpegKitExample.csproj" \
              --configuration Release -f "${{ matrix.tfm }}" \
              -p:RuntimeIdentifier=iossimulator-arm64 \
              -p:SampleSdkBand="${{ matrix.band }}" \
              -p:FFmpegKitVersion="${{ inputs.version }}" )

  e2e:
    name: simulator smoke test (${{ matrix.target-framework }})
    timeout-minutes: 45
    needs: pack
    runs-on: macos-15
    strategy:
      # fail-fast off: when one target framework breaks it is worth knowing whether the other did
      # too, since "net8 only" and "both" point at very different causes.
      fail-fast: false
      matrix:
        target-framework: ${{ fromJSON(inputs.e2e-target-frameworks) }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install iOS workload
        run: |
          # The device app is built for the target framework under test, so install the workload
          # for the band that owns it. global.json pins .NET 9; the app may need .NET 10.
          mkdir -p "${RUNNER_TEMP}/sdk10"
          ( cd "${RUNNER_TEMP}/sdk10" \
            && dotnet new globaljson --sdk-version "$(dotnet --list-sdks | grep '^10\.' | tail -1 | cut -d' ' -f1)" --force \
            && dotnet workload install ios )
          dotnet workload install ios

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Run smoke tests on simulator
        run: ./.github/scripts/run-simulator-tests.sh "${{ inputs.e2e-variant }}" "${{ inputs.version }}" "${{ matrix.target-framework }}"

      - name: Upload simulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-test-logs-${{ matrix.target-framework }}
          path: simulator-tests.log
          if-no-files-found: ignore
          retention-days: 7
